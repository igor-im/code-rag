[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coderag"
version = "0.1.0"
description = "Code search evaluation framework"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
keywords = ["code-search", "evaluation", "benchmark", "semantic-search", "bm25", "pgvector", "codesearchnet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/igorlima/code-rag"

dependencies = [
    "ranx>=0.3",
    "datasets>=3.0",
    "python-dotenv>=1.0",
    "transformers>=4.40",
    "torch>=2.0",
    "psycopg[binary]>=3.3.2",
    "pgvector>=0.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[project.scripts]
coderag = "eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coderag", "src/eval", "src/csn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
